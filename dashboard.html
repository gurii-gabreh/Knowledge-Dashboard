  :root {
    --bg: #f5f6fa;
    --surface: #ffffff;
    --surface-raised: #ffffff;
    --border: #e0e3ec;
    --border-strong: #c9cddb;
    --text: #1b1e2b;
    --text-muted: #666b80;
    --text-faint: #9195a8;
    --accent: #0f7a6c;
    --accent-soft: #e2f3ef;
    --accent-strong: #0a5a4f;
    --warn: #a86a10;
    --warn-soft: #fbf0dc;
    --shadow: 0 1px 2px rgba(20, 24, 40, 0.04), 0 8px 24px -12px rgba(20, 24, 40, 0.10);
    --radius: 10px;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14151d;
      --surface: #1b1d28;
      --surface-raised: #21232f;
      --border: #2c2f3d;
      --border-strong: #3a3d4e;
      --text: #e7e8f0;
      --text-muted: #9a9db0;
      --text-faint: #6d7086;
      --accent: #35b8a3;
      --accent-soft: #16302c;
      --accent-strong: #5fd0bd;
      --warn: #e0ac4d;
      --warn-soft: #332812;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14151d; --surface: #1b1d28; --surface-raised: #21232f; --border: #2c2f3d; --border-strong: #3a3d4e;
    --text: #e7e8f0; --text-muted: #9a9db0; --text-faint: #6d7086; --accent: #35b8a3; --accent-soft: #16302c;
    --accent-strong: #5fd0bd; --warn: #e0ac4d; --warn-soft: #332812;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }
  :root[data-theme="light"] {
    --bg: #f5f6fa; --surface: #ffffff; --surface-raised: #ffffff; --border: #e0e3ec; --border-strong: #c9cddb;
    --text: #1b1e2b; --text-muted: #666b80; --text-faint: #9195a8; --accent: #0f7a6c; --accent-soft: #e2f3ef;
    --accent-strong: #0a5a4f; --warn: #a86a10; --warn-soft: #fbf0dc;
    --shadow: 0 1px 2px rgba(20, 24, 40, 0.04), 0 8px 24px -12px rgba(20, 24, 40, 0.10);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  header.page-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 6px;
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin: 0 0 6px;
  }
  h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 30px;
    margin: 0;
    text-wrap: balance;
    letter-spacing: -0.01em;
  }
  .subtitle {
    color: var(--text-muted);
    font-size: 14px;
    margin: 8px 0 28px;
    max-width: 65ch;
  }
  .subtitle code {
    font-family: var(--mono);
    background: var(--accent-soft);
    color: var(--accent-strong);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 12.5px;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 28px;
  }
  .stat-tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow);
  }
  .stat-tile .num {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 26px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.1;
  }
  .stat-tile .label {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-bottom: 18px;
    position: sticky;
    top: 0;
    background: linear-gradient(var(--bg) 80%, transparent);
    padding: 10px 0 12px;
    z-index: 5;
  }
  .search-box {
    flex: 1 1 240px;
    position: relative;
  }
  .search-box input {
    width: 100%;
    padding: 9px 12px 9px 34px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  .search-box input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .search-box svg {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-faint);
  }
  select#sortSel {
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text);
    font-size: 13.5px;
  }
  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 22px;
  }
  .chip {
    font-size: 12.5px;
    padding: 5px 11px;
    border-radius: 999px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    user-select: none;
    transition: background 0.12s, color 0.12s, border-color 0.12s;
  }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  .chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
  }
  .chip .count { opacity: 0.75; font-variant-numeric: tabular-nums; }

  .group {
    margin-bottom: 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .group-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    cursor: pointer;
    user-select: none;
  }
  .group-head:hover { background: var(--surface-raised); }
  .group-head .caret {
    width: 9px; height: 9px;
    border-right: 2px solid var(--text-faint);
    border-bottom: 2px solid var(--text-faint);
    transform: rotate(-45deg);
    transition: transform 0.15s;
    flex: none;
  }
  .group.collapsed .group-head .caret { transform: rotate(45deg); }
  .group-head .gname {
    font-weight: 600;
    font-size: 14px;
    flex: 1;
  }
  .group-head .gcount {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-muted);
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 1px 7px;
    border-radius: 999px;
    font-variant-numeric: tabular-nums;
  }
  .group-body { border-top: 1px solid var(--border); }
  .group.collapsed .group-body { display: none; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  thead th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-faint);
    font-weight: 600;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
  }
  tbody tr { border-top: 1px solid var(--border); }
  tbody tr:hover { background: var(--surface-raised); }
  tbody td { padding: 10px 16px; vertical-align: middle; }
  td.col-title { max-width: 0; width: 46%; }
  td.col-title a {
    color: var(--text);
    text-decoration: none;
    font-weight: 500;
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  td.col-title a:hover { color: var(--accent-strong); text-decoration: underline; }
  td.col-title a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  td.col-date, td.col-owner { color: var(--text-muted); font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--warn-soft);
    color: var(--warn);
    font-weight: 600;
    white-space: nowrap;
  }

  .empty-state {
    text-align: center;
    padding: 48px 16px;
    color: var(--text-muted);
    font-size: 14px;
  }

  footer {
    margin-top: 32px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    color: var(--text-faint);
    font-size: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    justify-content: space-between;
  }
  footer .note { max-width: 60ch; }

  @media (max-width: 640px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    td.col-owner { display: none; }
    thead th.col-owner { display: none; }
  }
</style>
</head>

const items = DATA.items;
let activeCategories = new Set();
let query = "";
let sortMode = "modified_desc";
const collapsedGroups = new Set();

function fmtDate(iso) {
  const d = new Date(iso);
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,"0"), day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function renderStats() {
  const categories = new Set(items.map(i => i.category));
  const sharedCount = items.filter(i => i.shared).length;
  const lastUpdated = items.reduce((max, i) => new Date(i.modifiedTime) > new Date(max) ? i.modifiedTime : max, items[0].modifiedTime);
  const tiles = [
    { num: items.length, label: "スプレッドシート総数" },
    { num: categories.size, label: "カテゴリ / フォルダ数" },
    { num: sharedCount, label: "他ユーザー共有" },
    { num: fmtDate(lastUpdated), label: "最新更新日" },
  ];
  document.getElementById("stats").innerHTML = tiles.map(t =>
    `<div class="stat-tile"><div class="num">${t.num}</div><div class="label">${t.label}</div></div>`
  ).join("");
}

function renderChips() {
  const counts = {};
  items.forEach(i => counts[i.category] = (counts[i.category]||0) + 1);
  const cats = Object.keys(counts).sort((a,b) => counts[b]-counts[a]);
  const row = document.getElementById("chipRow");
  row.innerHTML = cats.map(c =>
    `<span class="chip${activeCategories.has(c) ? " active" : ""}" data-cat="${escapeAttr(c)}">${escapeHtml(c)} <span class="count">${counts[c]}</span></span>`
  ).join("");
  row.querySelectorAll(".chip").forEach(el => {
    el.addEventListener("click", () => {
      const cat = el.dataset.cat;
      if (activeCategories.has(cat)) activeCategories.delete(cat);
      else activeCategories.add(cat);
      renderChips();
      renderGroups();
    });
  });
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

function matches(item) {
  if (activeCategories.size && !activeCategories.has(item.category)) return false;
  if (!query) return true;
  const hay = (item.title + " " + item.category + " " + item.owner).toLowerCase();
  return hay.includes(query.toLowerCase());
}

function sortItems(list) {
  const arr = [...list];
  switch (sortMode) {
    case "modified_asc": arr.sort((a,b) => new Date(a.modifiedTime) - new Date(b.modifiedTime)); break;
    case "title_asc": arr.sort((a,b) => a.title.localeCompare(b.title, "ja")); break;
    case "category_asc": arr.sort((a,b) => a.category.localeCompare(b.category, "ja") || a.title.localeCompare(b.title, "ja")); break;
    default: arr.sort((a,b) => new Date(b.modifiedTime) - new Date(a.modifiedTime));
  }
  return arr;
}

function renderGroups() {
  const filtered = sortItems(items.filter(matches));
  const container = document.getElementById("groups");
  const emptyState = document.getElementById("emptyState");

  if (!filtered.length) {
    container.innerHTML = "";
    emptyState.style.display = "block";
    return;
  }
  emptyState.style.display = "none";

  if (sortMode !== "category_asc" && sortMode !== "modified_asc" && sortMode !== "modified_desc" && sortMode !== "title_asc") {
    // unreachable, keeps default grouping path below
  }

  // group by category, preserving first-seen order per current sort
  const groups = new Map();
  filtered.forEach(item => {
    if (!groups.has(item.category)) groups.set(item.category, []);
    groups.get(item.category).push(item);
  });

  let html = "";
  for (const [cat, list] of groups) {
    const collapsed = collapsedGroups.has(cat);
    html += `<div class="group${collapsed ? " collapsed" : ""}" data-group="${escapeAttr(cat)}">
      <div class="group-head">
        <span class="caret"></span>
        <span class="gname">${escapeHtml(cat)}</span>
        <span class="gcount">${list.length}</span>
      </div>
      <div class="group-body">
        <table>
          <thead><tr>
            <th class="col-title">タイトル</th>
            <th class="col-date">最終更新</th>
            <th class="col-owner">所有者</th>
          </tr></thead>
          <tbody>
            ${list.map(item => `<tr>
              <td class="col-title"><a href="${item.url}" target="_blank" rel="noopener">${escapeHtml(item.title)}</a></td>
              <td class="col-date">${fmtDate(item.modifiedTime)}</td>
              <td class="col-owner">${item.shared ? `<span class="badge">共有</span> ${escapeHtml(item.owner.split("@")[0])}` : "自分"}</td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>`;
  }
  container.innerHTML = html;

  container.querySelectorAll(".group-head").forEach(el => {
    el.addEventListener("click", () => {
      const group = el.closest(".group");
      const cat = group.dataset.group;
      if (collapsedGroups.has(cat)) collapsedGroups.delete(cat);
      else collapsedGroups.add(cat);
      group.classList.toggle("collapsed");
    });
  });
}

document.getElementById("searchInput").addEventListener("input", (e) => {
  query = e.target.value;
  renderGroups();
});
document.getElementById("sortSel").addEventListener("change", (e) => {
  sortMode = e.target.value;
  renderGroups();
});

document.getElementById("genNote").textContent =
  `最終取得: ${fmtDate(DATA.generatedAt)}（Claude が Google Drive コネクタ経由で取得）`;

renderStats();
renderChips();
renderGroups();
</script>
