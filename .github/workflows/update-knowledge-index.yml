name: Update knowledge index

on:
  schedule:
    # 毎日 21:00 UTC (06:00 JST) に実行
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate data/knowledge-index.json
        run: node scripts/generate-knowledge-index.js

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/knowledge-index.json; then
            echo "No changes to data/knowledge-index.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/knowledge-index.json
          git commit -m "chore: update knowledge-index.json"
          git push
