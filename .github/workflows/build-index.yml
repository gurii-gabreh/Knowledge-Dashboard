name: Build knowledge index

on:
  push:
  schedule:
    - cron: '0 18 * * *' # 03:00 JST daily
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build knowledge index
        run: node scripts/build-index.js

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/knowledge-index.json; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/knowledge-index.json
          git commit -m "chore: update knowledge index"
          git push
